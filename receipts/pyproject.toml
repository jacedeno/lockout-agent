[project]
name = "arz-receipts"
version = "0.1.0"
description = "Hash-chained execution logs, artifact hashing and Ed25519-signed receipts"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["cryptography>=43"]

[project.scripts]
arz-receipt = "arz_receipts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arz_receipts"]
