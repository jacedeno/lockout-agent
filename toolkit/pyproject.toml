[project]
name = "vibkit"
version = "0.1.0"
description = "Vibration diagnostics for rotating machinery: velocity RMS, ISO 20816-3 zones, fault signatures"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[project.scripts]
vibkit = "vibkit.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibkit"]
